<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Manipulation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1 id="heading">Original Heading</h1>
    <p id="para">This is a paragraph that can be shown or hidden.</p>
    <input id="userInput" type="text" placeholder="Enter text">
    <br><br>
    <button onclick="changeHeading()">Change Heading</button>
    <button onclick="changeBg()">Change Background</button>
    <button onclick="changeFontSize()">Increase Font Size</button>
    <button onclick="togglePara()">Show/Hide Paragraph</button>
    <button onclick="resetPage()">Reset</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
