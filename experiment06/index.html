<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Manipulation</title>
</head>
<body>
  <h1 id="heading">Original Heading</h1>
  <p id="para">This is a paragraph that can be shown or hidden.</p>
  <input id="userInput" type="text" placeholder="Enter text">
  <br><br>
  <button onclick="changeHeading()">Change Heading</button>
  <button onclick="changeBg()">Change Background</button>
  <button onclick="changeFontSize()">Increase Font Size</button>
  <button onclick="togglePara()">Show/Hide Paragraph</button>
  <button onclick="resetPage()">Reset</button>
  <script>
    function changeHeading() {
      const val = document.getElementById("userInput").value;
      if (val) document.getElementById("heading").textContent = val;
    }
    function changeBg() {
      document.body.style.backgroundColor =
        "#" + Math.floor(Math.random() * 16777215).toString(16);
    }
    function changeFontSize() {
      const h = document.getElementById("heading");
      h.style.fontSize = (parseInt(window.getComputedStyle(h).fontSize) + 4) + "px";
    }
    function togglePara() {
      const p = document.getElementById("para");
      p.style.display = p.style.display === "none" ? "block" : "none";
    }
    function resetPage() {
      document.getElementById("heading").textContent = "Original Heading";
      document.getElementById("heading").style.fontSize = "";
      document.body.style.backgroundColor = "";
      document.getElementById("para").style.display = "block";
      document.getElementById("userInput").value = "";
    }
  </script>
</body>
</html>
